name: Aktualizacja zastępstw (7a)

on:
  schedule:
    - cron: '*/30 4-15 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Ustaw Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Zainstaluj zależności
        run: pip install requests beautifulsoup4

      - name: Uruchom skrypt aktualizujący
        run: python scripts/update_substitution.py

      - name: Commituj zmiany (jeśli są)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Auto: aktualizacja zastępstw 7a"
          git push
